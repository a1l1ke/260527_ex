<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개 페이지</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
        }
    </style>
</head>
<body>
    <header class="bg-primary text-white text-center py-5">
        <div class="container">
            <h1 class="display-4">홍길동</h1>
            <p class="lead">프론트엔드 개발자</p>
        </div>
    </header>

    <main class="container my-5">
        <section class="mb-5">
            <h2>소개</h2>
            <p class="lead">
                안녕하세요! 저는 웹 개발에 열정을 가진 프론트엔드 개발자입니다.
                사용자 친화적이고 성능 좋은 웹 애플리케이션을 만드는 것을 목표로 하고 있습니다.
            </p>
        </section>

        <section class="mb-5">
            <h2>기술 스택</h2>
            <div class="row g-3">
                <div class="col-md-4">
                    <span class="badge bg-success rounded-pill">HTML5</span>
                </div>
                <div class="col-md-4">
                    <span class="badge bg-success rounded-pill">CSS3</span>
                </div>
                <div class="col-md-4">
                    <span class="badge bg-success rounded-pill">JavaScript</span>
                </div>
                <div class="col-md-4">
                    <span class="badge bg-success rounded-pill">Bootstrap 5</span>
                </div>
                <div class="col-md-4">
                    <span class="badge bg-success rounded-pill">React</span>
                </div>
                <div class="col-md-4">
                    <span class="badge bg-success rounded-pill">Vue.js</span>
                </div>
            </div>
        </section>

        <section class="mb-5">
            <h2>연락처</h2>
            <div class="list-group">
                <a href="#" class="list-group-item list-group-item-action"><i class="bi bi-envelope me-2"></i> email@example.com</a>
                <a href="#" class="list-group-item list-group-item-action"><i class="bi bi-github me-2"></i> github.com/username</a>
                <a href="#" class="list-group-item list-group-item-action"><i class="bi bi-linkedin me-2"></i> linkedin.com/in/username</a>
            </div>
        </section>
    </main>

    <footer class="bg-light text-center py-3 mt-auto">
        <div class="container">
            <small class="text-muted">&copy; 2026 홍길동. 모든 권리 보유.</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS (Bundle includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</body>
</html>
